<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260">
  <style>
    @keyframes recPulse { 0%, 100% { r: 8; opacity: 1; } 50% { r: 12; opacity: 0.6; } }
    @keyframes barGrow1 { from { width: 0; } to { width: 180px; } }
    @keyframes barGrow2 { from { width: 0; } to { width: 140px; } }
    @keyframes barGrow3 { from { width: 0; } to { width: 200px; } }
    @keyframes barGrow4 { from { width: 0; } to { width: 90px; } }
    @keyframes countUp1 { 0% { opacity: 0; } 15% { opacity: 1; } }
    @keyframes countUp2 { 0%, 15% { opacity: 0; } 30% { opacity: 1; } }
    @keyframes countUp3 { 0%, 30% { opacity: 0; } 45% { opacity: 1; } }
    @keyframes countUp4 { 0%, 45% { opacity: 0; } 60% { opacity: 1; } }
    .bg { fill: #0d1117; }
    .rec-dot { fill: #ff0040; animation: recPulse 1.5s ease-in-out infinite; }
    .rec-label { fill: #ff0040; font-family: 'Courier New', monospace; font-size: 14px; font-weight: 700; letter-spacing: 3px; }
    .player-frame { fill: #1a1a2e; stroke: #333; stroke-width: 1; rx: 8; }
    .player-content { fill: #12121f; rx: 4; }
    .timeline { fill: #333; rx: 2; }
    .timeline-progress { fill: #bb86fc; rx: 2; }
    .stat-label { fill: #888; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; }
    .stat-value { fill: #e0e0e0; font-family: 'Courier New', monospace; font-size: 18px; font-weight: 700; }
    .bar-track { fill: #1a1a2e; rx: 3; }
    .bar1 { fill: #bb86fc; rx: 3; animation: barGrow1 1.5s 0.5s ease-out both; }
    .bar2 { fill: #6b2fa0; rx: 3; animation: barGrow2 1.5s 0.8s ease-out both; }
    .bar3 { fill: #bb86fc; rx: 3; animation: barGrow3 1.5s 1.1s ease-out both; }
    .bar4 { fill: #6b2fa0; rx: 3; animation: barGrow4 1.5s 1.4s ease-out both; }
    .section-title { fill: #bb86fc; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 2px; }
    .s1 { animation: countUp1 3s both; }
    .s2 { animation: countUp2 3s both; }
    .s3 { animation: countUp3 3s both; }
    .s4 { animation: countUp4 3s both; }
  </style>
  <rect class="bg" width="800" height="260" rx="16"/>
  <rect class="player-frame" x="30" y="15" width="360" height="200"/>
  <rect class="player-content" x="40" y="25" width="340" height="155"/>
  <circle class="rec-dot" cx="70" cy="45" r="8"/>
  <text class="rec-label" x="85" y="49">REC</text>
  <rect rx="3" x="120" y="145" width="180" height="20" fill="#00000099"/>
  <text x="210" y="159" text-anchor="middle" style="fill:#fff;font-size:10px;font-family:system-ui;">Auto-generated subtitles</text>
  <rect class="timeline" x="40" y="188" width="340" height="4"/>
  <rect class="timeline-progress" x="40" y="188" width="170" height="4"/>
  <text class="section-title" x="430" y="35">LIVE ANALYTICS</text>
  <g class="s1">
    <text class="stat-label" x="430" y="65">Total Views</text>
    <text class="stat-value" x="430" y="85">1,247</text>
    <rect class="bar-track" x="530" y="73" width="200" height="8"/>
    <rect class="bar1" x="530" y="73" height="8"/>
  </g>
  <g class="s2">
    <text class="stat-label" x="430" y="115">Avg Watch Time</text>
    <text class="stat-value" x="430" y="135">4:32</text>
    <rect class="bar-track" x="530" y="123" width="200" height="8"/>
    <rect class="bar2" x="530" y="123" height="8"/>
  </g>
  <g class="s3">
    <text class="stat-label" x="430" y="165">Completion Rate</text>
    <text class="stat-value" x="430" y="185">78%</text>
    <rect class="bar-track" x="530" y="173" width="200" height="8"/>
    <rect class="bar3" x="530" y="173" height="8"/>
  </g>
  <g class="s4">
    <text class="stat-label" x="430" y="215">Unique Viewers</text>
    <text class="stat-value" x="430" y="235">892</text>
    <rect class="bar-track" x="530" y="223" width="200" height="8"/>
    <rect class="bar4" x="530" y="223" height="8"/>
  </g>
  <text style="fill:#555;font-size:10px;font-family:'Courier New',monospace;" x="400" y="255" text-anchor="middle">Node.js + Express | Self-hosted | Zero third-party tracking</text>
</svg>
