<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" fill="none">
  <defs>
    <!-- Colors: bg-primary #070910, bg-secondary #05060b -->
    <!-- accent #8b0d1d (deep crimson), accent-hover #ffffff -->
    <!-- text-primary #f5f5f5, text-muted rgba(245,245,245,0.7) -->
    <!-- border rgba(255,255,255,0.08), border-hover rgba(255,255,255,0.4) -->
    <!-- error #ef4444, success #22c55e -->
    <!-- Fonts: Audiowide (logo/nav), Space Grotesk (body) -->
    <!-- Card style: border-radius 20px, backdrop-filter blur(12px) -->
    <linearGradient id="siduriBg" x1="0" y1="0" x2="800" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070910"/>
      <stop offset="100%" stop-color="#05060b"/>
    </linearGradient>
    <style>
      @keyframes recPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.15; } }
      .rec { animation: recPulse 1.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background: bg-primary to bg-secondary -->
  <rect width="800" height="180" fill="url(#siduriBg)"/>

  <!-- Logo (.logo style: Audiowide, lowercase, letter-spacing 0.05em, opacity 0.6) -->
  <text x="60" y="42" font-family="'Audiowide',sans-serif" font-size="14"
        fill="#f5f5f5" fill-opacity="0.6" letter-spacing="0.05em">siduri</text>

  <!-- Pill navigation preview (.nav: pill-shaped, backdrop-blur, centered) -->
  <g transform="translate(260, 20)">
    <rect x="0" y="0" width="280" height="34" rx="17"
          fill="#0c0117" fill-opacity="0.4" stroke="white" stroke-opacity="0.1" stroke-width="1"/>
    <!-- Nav items (Audiowide, lowercase, letter-spacing 0.1em) -->
    <!-- Active item: border 2px solid white, rounded pill -->
    <rect x="8" y="4" width="80" height="26" rx="13" fill="none" stroke="white" stroke-opacity="0.9" stroke-width="1.5"/>
    <text x="48" y="22" font-family="'Audiowide',sans-serif" font-size="10" fill="#f5f5f5"
          text-anchor="middle" letter-spacing="0.1em">record</text>
    <!-- Inactive items -->
    <text x="140" y="22" font-family="'Audiowide',sans-serif" font-size="10" fill="#f5f5f5"
          fill-opacity="0.7" text-anchor="middle" letter-spacing="0.1em">library</text>
    <text x="230" y="22" font-family="'Audiowide',sans-serif" font-size="10" fill="#f5f5f5"
          fill-opacity="0.7" text-anchor="middle" letter-spacing="0.1em">share</text>
  </g>

  <!-- Main title area (h1 style: Space Grotesk, lowercase, font-weight 600) -->
  <text x="120" y="95" font-family="'Space Grotesk',system-ui,sans-serif" font-size="42" font-weight="600"
        fill="#f5f5f5" letter-spacing="0.02em" text-transform="lowercase">siduri</text>

  <!-- Audio waveform bars (accent #8b0d1d deep crimson, SMIL animated) -->
  <g transform="translate(420, 0)">
    <rect x="0" y="68" width="7" height="22" rx="2" fill="#8b0d1d">
      <animate attributeName="height" values="22;42;16;36;22" keyTimes="0;0.25;0.5;0.75;1" dur="2.2s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
      <animate attributeName="y" values="68;48;74;54;68" keyTimes="0;0.25;0.5;0.75;1" dur="2.2s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    </rect>
    <rect x="14" y="54" width="7" height="36" rx="2" fill="#8b0d1d">
      <animate attributeName="height" values="36;16;46;22;36" keyTimes="0;0.25;0.5;0.75;1" dur="2.2s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
      <animate attributeName="y" values="54;74;44;68;54" keyTimes="0;0.25;0.5;0.75;1" dur="2.2s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    </rect>
    <rect x="28" y="62" width="7" height="28" rx="2" fill="#8b0d1d">
      <animate attributeName="height" values="28;50;32;46;28" keyTimes="0;0.25;0.5;0.75;1" dur="2.2s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
      <animate attributeName="y" values="62;40;58;44;62" keyTimes="0;0.25;0.5;0.75;1" dur="2.2s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    </rect>
    <rect x="42" y="48" width="7" height="42" rx="2" fill="#8b0d1d">
      <animate attributeName="height" values="42;22;38;50;42" keyTimes="0;0.25;0.5;0.75;1" dur="2.2s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
      <animate attributeName="y" values="48;68;52;40;48" keyTimes="0;0.25;0.5;0.75;1" dur="2.2s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    </rect>
    <rect x="56" y="74" width="7" height="16" rx="2" fill="#8b0d1d">
      <animate attributeName="height" values="16;32;50;28;16" keyTimes="0;0.25;0.5;0.75;1" dur="2.2s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
      <animate attributeName="y" values="74;58;40;62;74" keyTimes="0;0.25;0.5;0.75;1" dur="2.2s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    </rect>
    <rect x="70" y="58" width="7" height="32" rx="2" fill="#8b0d1d">
      <animate attributeName="height" values="32;46;22;42;32" keyTimes="0;0.25;0.5;0.75;1" dur="2.2s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
      <animate attributeName="y" values="58;44;68;48;58" keyTimes="0;0.25;0.5;0.75;1" dur="2.2s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    </rect>
    <rect x="84" y="44" width="7" height="46" rx="2" fill="#8b0d1d">
      <animate attributeName="height" values="46;28;42;16;46" keyTimes="0;0.25;0.5;0.75;1" dur="2.2s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
      <animate attributeName="y" values="44;62;48;74;44" keyTimes="0;0.25;0.5;0.75;1" dur="2.2s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- REC indicator (error: #ef4444, recording pulse) -->
  <g class="rec" transform="translate(540, 62)">
    <circle cx="0" cy="0" r="4" fill="#ef4444"/>
    <text x="10" y="4" font-family="'Space Grotesk',sans-serif" font-size="11" fill="#ef4444" font-weight="600"
          letter-spacing="0.04em">REC</text>
  </g>

  <!-- Record button preview (.record-btn: 64px circle, border 3px solid accent) -->
  <g transform="translate(660, 52)">
    <circle cx="24" cy="24" r="22" fill="none" stroke="#8b0d1d" stroke-width="2.5"/>
    <circle cx="24" cy="24" r="8" fill="#8b0d1d"/>
  </g>

  <!-- Tagline (text-muted, Space Grotesk, lowercase) -->
  <text x="120" y="124" font-family="'Space Grotesk',system-ui,sans-serif" font-size="13"
        fill="#f5f5f5" fill-opacity="0.7" letter-spacing="0.02em">record, transcribe, summarize</text>

  <!-- Sub info (smaller, more muted) -->
  <text x="120" y="148" font-family="'Space Grotesk',system-ui,sans-serif" font-size="10"
        fill="#f5f5f5" fill-opacity="0.4" letter-spacing="0.04em">single-tenant video sharing with viewer analytics</text>

  <!-- Bottom border accent (subtle crimson) -->
  <rect x="0" y="176" width="800" height="4" fill="#8b0d1d" fill-opacity="0.3"/>
</svg>
